<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1244" width="100%" height="100%">
  <defs>
    <radialGradient id="parchmentGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFFCF7" />
      <stop offset="65%" stop-color="#FBF6EB" />
      <stop offset="100%" stop-color="#F2E8D5" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6A15" />
    </linearGradient>
    <linearGradient id="vineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E6E4D" />
      <stop offset="100%" stop-color="#354D34" />
    </linearGradient>
  </defs>

  <!-- Background Paper -->
  <rect width="880" height="1244" fill="url(#parchmentGrad)" />

  <!-- Outer Fine Gold Border -->
  <rect x="28" y="28" width="824" height="1188" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85" />

  <!-- Inner Fine Border -->
  <rect x="36" y="36" width="808" height="1172" rx="6" fill="none" stroke="#C59B27" stroke-width="0.8" opacity="0.45" stroke-dasharray="8 4" />

  <!-- Corner Ornament Top-Left -->
  <g transform="translate(30, 30)">
    <path d="M 0 45 C 0 15, 15 0, 45 0 L 25 0 C 10 0, 0 10, 0 25 Z" fill="url(#goldGrad)" />
    <path d="M 6 6 L 36 6 M 6 6 L 6 36" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="16" cy="16" r="3" fill="#A82835" />
    <circle cx="28" cy="10" r="2" fill="#D4AF37" />
    <circle cx="10" cy="28" r="2" fill="#D4AF37" />
  </g>

  <!-- Corner Ornament Top-Right -->
  <g transform="translate(850, 30) scale(-1, 1)">
    <path d="M 0 45 C 0 15, 15 0, 45 0 L 25 0 C 10 0, 0 10, 0 25 Z" fill="url(#goldGrad)" />
    <path d="M 6 6 L 36 6 M 6 6 L 6 36" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="16" cy="16" r="3" fill="#A82835" />
    <circle cx="28" cy="10" r="2" fill="#D4AF37" />
    <circle cx="10" cy="28" r="2" fill="#D4AF37" />
  </g>

  <!-- Corner Ornament Bottom-Left -->
  <g transform="translate(30, 1214) scale(1, -1)">
    <path d="M 0 45 C 0 15, 15 0, 45 0 L 25 0 C 10 0, 0 10, 0 25 Z" fill="url(#goldGrad)" />
    <path d="M 6 6 L 36 6 M 6 6 L 6 36" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="16" cy="16" r="3" fill="#A82835" />
    <circle cx="28" cy="10" r="2" fill="#D4AF37" />
    <circle cx="10" cy="28" r="2" fill="#D4AF37" />
  </g>

  <!-- Corner Ornament Bottom-Right -->
  <g transform="translate(850, 1214) scale(-1, -1)">
    <path d="M 0 45 C 0 15, 15 0, 45 0 L 25 0 C 10 0, 0 10, 0 25 Z" fill="url(#goldGrad)" />
    <path d="M 6 6 L 36 6 M 6 6 L 6 36" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="16" cy="16" r="3" fill="#A82835" />
    <circle cx="28" cy="10" r="2" fill="#D4AF37" />
    <circle cx="10" cy="28" r="2" fill="#D4AF37" />
  </g>

  <!-- Top Center Floral Motif -->
  <g transform="translate(440, 28)">
    <path d="M -70 0 Q -35 -12 0 0 Q 35 -12 70 0" fill="none" stroke="url(#vineGrad)" stroke-width="1.8" />
    <!-- Center flower -->
    <circle cx="0" cy="-2" r="5" fill="#A82835" />
    <circle cx="-12" cy="-4" r="3" fill="#E86A75" />
    <circle cx="12" cy="-4" r="3" fill="#E86A75" />
    <circle cx="-24" cy="-3" r="2.5" fill="#8E44AD" />
    <circle cx="24" cy="-3" r="2.5" fill="#8E44AD" />
    <!-- Leaves -->
    <path d="M -40 -3 C -48 -9, -54 -4, -42 -1" fill="#4E6E4D" />
    <path d="M 40 -3 C 48 -9, 54 -4, 42 -1" fill="#4E6E4D" />
  </g>

  <!-- Bottom Center Floral Motif -->
  <g transform="translate(440, 1216) scale(1, -1)">
    <path d="M -70 0 Q -35 -12 0 0 Q 35 -12 70 0" fill="none" stroke="url(#vineGrad)" stroke-width="1.8" />
    <circle cx="0" cy="-2" r="5" fill="#A82835" />
    <circle cx="-12" cy="-4" r="3" fill="#E86A75" />
    <circle cx="12" cy="-4" r="3" fill="#E86A75" />
    <circle cx="-24" cy="-3" r="2.5" fill="#8E44AD" />
    <circle cx="24" cy="-3" r="2.5" fill="#8E44AD" />
    <path d="M -40 -3 C -48 -9, -54 -4, -42 -1" fill="#4E6E4D" />
    <path d="M 40 -3 C 48 -9, 54 -4, 42 -1" fill="#4E6E4D" />
  </g>
</svg>
